name: Hiawatha Distribution Hub

on:
  # Off the top of the hour: GitHub delays/drops :00 schedules under load.
  schedule: [{cron: '37 2 * * *'}] # 02:37 UTC daily
  # Manual run = "check now". There is no force-rebuild knob any more: the
  # plan step rebuilds whatever the published indexes are missing, so a
  # packaging fix ships by bumping the debian/changelog revision and pushing.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'debian/**'
      - '.github/targets.json'

# Least privilege by default. Jobs that need more elevate explicitly below.
permissions:
  contents: read

# Serialize runs (schedule vs. manual vs. push). Never cancel mid-run: a
# half-finished publish/tag would leave the repo inconsistent.
# Explicit bash = -eo pipefail (the implicit default is plain -e).
defaults:
  run:
    shell: bash

concurrency:
  group: distribution-hub
  cancel-in-progress: false

env:
  # ── Fork configuration ─────────────────────────────────────────────────────
  # These plus .github/targets.json (distros, arches, version suffixes) are the
  # only things to change when adapting this workflow for another upstream.
  # ───────────────────────────────────────────────────────────────────────────
  UPSTREAM_GITLAB_PROJECT: 'hsleisink%2Fhiawatha'  # URL-encoded, for GitLab API calls
  UPSTREAM_GITLAB_PATH: 'hsleisink/hiawatha'         # slash-separated, for git clone
  GPG_KEY_FILENAME: 'hiawatha.asc'                   # public key file in repo root
  GIT_AUTHOR_NAME: 'GitHub Actions Bot'              # identity for automated commits
  GIT_AUTHOR_EMAIL: 'actions@github.com'             # identity for automated commits

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      actions: write   # self re-enable (keepalive) — see step below
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      build_needed: ${{ steps.plan.outputs.build_needed }}
      finalize_needed: ${{ steps.plan.outputs.finalize_needed }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      publish_codenames: ${{ steps.plan.outputs.publish_codenames }}
    steps:
      - uses: actions/checkout@v6
      - name: Keepalive — reset the 60-day scheduler inactivity timer
        # GitHub disables scheduled workflows in a public repo after 60 days with
        # no commit activity on the default branch. Tags and gh-pages commits
        # don't count, and upstream can go months between releases. Re-enabling
        # via the API resets the timer without polluting history. Runs before the
        # GitLab call so an upstream outage can't skip it.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable distribution.yml
      - name: Determine latest upstream release
        id: upstream
        run: |
          # order_by=version sorts semantically server-side; the jq filter drops
          # rc/beta/nightly tags. -f makes a GitLab 5xx a hard failure.
          LATEST=$(curl -fsS --retry 3 \
            "https://gitlab.com/api/v4/projects/${UPSTREAM_GITLAB_PROJECT}/repository/tags?order_by=version&sort=desc" \
            | jq -r '[.[].name | select(test("^v?[0-9][0-9.]*$"))][0] // empty' \
            | sed 's/^v//')
          if [ -z "$LATEST" ]; then
            echo "::error::Could not determine latest release tag from GitLab"
            exit 1
          fi
          echo "Latest upstream: v$LATEST"
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
      - name: Plan — compare against what is actually published
        id: plan
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          # The published Packages indexes are the source of truth (see
          # plan.py). Missing gh-pages (fresh fork) just means "build all".
          REF=""
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then REF=FETCH_HEAD; fi
          python3 .github/scripts/plan.py "$TAG" "$REF" | tee -a "$GITHUB_OUTPUT"
          # finalize (verify, homepage, tag) also runs when nothing needs
          # building but the release was never tagged — e.g. a broken distro
          # was dropped from targets.json and everything left is published.
          BUILD=$(sed -n 's/^build_needed=//p' "$GITHUB_OUTPUT" | tail -n1)
          if [ "$BUILD" = true ] || ! git ls-remote --exit-code --tags origin "refs/tags/v${TAG}" >/dev/null; then
            echo "finalize_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "finalize_needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Warn about unshipped packaging changes
        if: github.event_name == 'push' && steps.plan.outputs.build_needed == 'false'
        run: |
          echo "::warning::debian/ changed but ${{ steps.plan.outputs.version }} is already published everywhere. Bump the debian/changelog revision (e.g. ${{ steps.plan.outputs.tag }}-N) to ship it."

  build-debs:
    needs: check-version
    if: needs.check-version.outputs.build_needed == 'true'
    name: build (${{ matrix.codename }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false # one distro breaking must not cancel the others
      matrix: ${{ fromJSON(needs.check-version.outputs.build_matrix) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The workspace is bind-mounted into a container running *upstream's*
          # build system; don't leave a write-scoped token in .git/config.
          persist-credentials: false
      - name: Fetch Hiawatha upstream source
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          # GitLab's archive API 404s without auth; clone the tag instead.
          git clone --depth=1 --branch "v${TAG}" \
            "https://gitlab.com/${UPSTREAM_GITLAB_PATH}.git" /tmp/hiawatha-src
          # Overlay upstream onto the workspace without touching our packaging
          # or pipeline scripts.
          rsync -a --exclude='.git' --exclude='debian' --exclude='.github' \
            /tmp/hiawatha-src/ ./
          ls -la CMakeLists.txt src/ >/dev/null
      - name: Build in ${{ matrix.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" \
            -e VERSION="${{ needs.check-version.outputs.version }}" \
            -e SUFFIX="${{ matrix.suffix }}" \
            -e CODENAME="${{ matrix.codename }}" \
            "${{ matrix.image }}" bash /work/.github/scripts/container-build.sh
          # out/ was created by root in the container; copy, don't mv.
          mkdir -p staging
          cp out/hiawatha_*.deb staging/
          for deb in staging/*.deb; do
            dpkg-deb --info "$deb" | grep -E 'Package|Version|Architecture|Installed-Size|Depends'
            dpkg-deb --contents "$deb"
          done
      - name: Smoke test in clean ${{ matrix.image }}
        # Install with the distro's own deps, validate config, serve a request.
        # Nothing that fails this gets signed or reaches anyone's apt.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/staging:/debs:ro" \
            -v "$GITHUB_WORKSPACE/.github/scripts/smoke-test.sh:/smoke-test.sh:ro" \
            "${{ matrix.image }}" bash /smoke-test.sh
      - uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.codename }}-${{ matrix.arch }}
          path: staging/hiawatha_*.deb
          if-no-files-found: error

  publish-apt:
    needs: [check-version, build-debs]
    # !cancelled(): publish whatever built even if another distro's leg failed,
    # so one broken target can't hold the rest hostage. finalize still requires
    # every leg to succeed, so the release isn't tagged and tomorrow's run
    # retries only the missing pairs (and the failure email keeps coming).
    if: ${{ !cancelled() && needs.check-version.outputs.build_needed == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1  # serialize gh-pages pushes between codenames
      matrix:
        codename: ${{ fromJSON(needs.check-version.outputs.publish_codenames) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v6
      - name: Download debs for ${{ matrix.codename }}
        uses: actions/download-artifact@v7
        # A codename whose builds all failed has no artifacts; that's handled
        # (both publish steps skip), not an error.
        continue-on-error: true
        with:
          path: debs
          pattern: deb-${{ matrix.codename }}-*
          merge-multiple: true
      - name: Resolve deb paths and repo config
        id: debs
        run: |
          shopt -s nullglob
          AMD64=(debs/*_amd64.deb) ARM64=(debs/*_arm64.deb)
          {
            echo "amd64=${AMD64[0]:-}"
            echo "arm64=${ARM64[0]:-}"
            echo 'codenames<<EOF'; jq -r '.targets[].codename' .github/targets.json; echo 'EOF'
            echo 'arches<<EOF';    jq -r '.arches[]'           .github/targets.json; echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "--- downloaded debs ---"
          ls -lh debs/ 2>/dev/null || echo "(none)"
      - name: Stage git credentials for Docker action
        # The apt-repo-action container gets HOME=/home/runner from the runner,
        # so git inside it can't find credentials and falls back to a TTY prompt
        # (ENXIO). Embed auth via http.extraHeader in a gitconfig on the
        # _github_home mount and point GIT_CONFIG_GLOBAL at it.
        run: |
          GH_HOME="${RUNNER_TEMP}/_github_home"
          mkdir -p "$GH_HOME"
          BASIC=$(printf 'x-access-token:%s' "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          git config --file "$GH_HOME/.gitconfig" \
            http.https://github.com/.extraHeader "AUTHORIZATION: basic ${BASIC}"
          chmod 600 "$GH_HOME/.gitconfig"
          echo "GIT_CONFIG_GLOBAL=/github/home/.gitconfig" >> "$GITHUB_ENV"
      # NOTE: apt-repo-action skips (exit 0) any version/arch/codename it has
      # published before ("loop detection"), so re-publishing is idempotent.
      # It also ignores reprepro's exit codes — finalize's verify step is what
      # catches a failed include/export.
      - name: Publish ${{ matrix.codename }} amd64
        if: steps.debs.outputs.amd64 != ''
        # Pinned to a commit SHA: this action receives the GPG signing key.
        # Re-pin deliberately after auditing upstream changes.
        uses: MauroDruwel/apt-repo-action@2ced6fde712c7fe3f572e2e611a4f2a879d86595 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_supported_version: ${{ steps.debs.outputs.codenames }}
          repo_supported_arch: ${{ steps.debs.outputs.arches }}
          private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          public_key: ${{ secrets.GPG_PUBLIC_KEY }}
          file: ${{ steps.debs.outputs.amd64 }}
          file_target_version: ${{ matrix.codename }}
          target_repository: ${{ github.repository }}
      - name: Publish ${{ matrix.codename }} arm64
        if: steps.debs.outputs.arm64 != ''
        uses: MauroDruwel/apt-repo-action@2ced6fde712c7fe3f572e2e611a4f2a879d86595 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_supported_version: ${{ steps.debs.outputs.codenames }}
          repo_supported_arch: ${{ steps.debs.outputs.arches }}
          private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          public_key: ${{ secrets.GPG_PUBLIC_KEY }}
          file: ${{ steps.debs.outputs.arm64 }}
          file_target_version: ${{ matrix.codename }}
          target_repository: ${{ github.repository }}

  finalize:
    # Runs only if no build or publish leg failed (skipped is fine: nothing to
    # build but the release still needs verifying/tagging).
    needs: [check-version, build-debs, publish-apt]
    if: >-
      ${{ !cancelled()
          && needs.check-version.outputs.finalize_needed == 'true'
          && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check-version.outputs.tag }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Check out gh-pages alongside main
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git fetch --depth=1 origin gh-pages
          git worktree add -B gh-pages gh-pages-branch FETCH_HEAD
      - name: Verify published repo end to end
        # Signature, signed hashes vs. index files, expected version for every
        # codename/arch, and pool file integrity. Runs before tagging and before
        # the homepage advertises the new version.
        run: python3 .github/scripts/verify-repo.py gh-pages-branch/repo "$GPG_KEY_FILENAME" "$VERSION"
      - name: Publish static assets to gh-pages
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}"
          python3 .github/scripts/gen-pages.py "$PAGES_URL" "$GPG_KEY_FILENAME" "$TAG" "$VERSION" gh-pages-branch
          cp "$GPG_KEY_FILENAME" gh-pages-branch/
          cd gh-pages-branch
          touch .nojekyll
          # gh-pages was originally branched from main; drop the stale copies of
          # the pipeline/packaging that otherwise get served on the Pages site.
          # (public.key is written by apt-repo-action and must stay.)
          git rm -r -q --ignore-unmatch .github arch debian
          git add .nojekyll "$GPG_KEY_FILENAME" index.html repo/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update static assets on gh-pages [v${VERSION}]"
            git push origin gh-pages
          fi
      - name: Tag upstream release
        run: |
          # The tag records which upstream versions have shipped; it no longer
          # gates builds (plan.py reads the published indexes instead).
          if git ls-remote --exit-code --tags origin "refs/tags/v${TAG}" >/dev/null; then
            echo "Tag v${TAG} already exists."
          else
            git tag "v${TAG}"
            git push origin "v${TAG}"
          fi
